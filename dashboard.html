function pStyle(css){
  var o = {};

    var i = decl.indexOf(':');
    if (i < 0) return;
    var prop = decl.slice(0, i).trim();
    var val = decl.slice(i + 1).trim();
    if (!prop || !val) return;
    var key = prop.indexOf('--') === 0 ? prop : prop.replace(/-([a-z])/g, function(_, c){ return c.toUpperCase(); });
    o[key] = val;
  });
  return o;
}

}

      deltaColor: up ? '#2f8f5b' : (down ? '#c0392b' : '#8a8175'),

  sheetsToData(qRows, showRows, socialRows){

      bucket[key].push({ title: r['Post Title'].toString(), url: (r['Post URL'] || '').toString(), showCategory: (r['Show / Category'] || '').toString(), postType: (r['Post Type'] || '').toString(), engagement: self.N(r['Engagement']), reach: self.N(r['Reach']), threeSecViews: self.N(r['3-Second Views']), views: self.N(r['Views']), mainAccount: (r['Main Posting Account'] || '').toString() });

  excelDate(v){

  onFile(e){
    var self = this;
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var isJson = /\.json$/i.test(f.name);
    var r = new FileReader();
    r.onload = function(){
      try{
        var data;
        if (isJson){
          data = JSON.parse(r.result);
          if (!data || !Array.isArray(data.quarters)) throw new Error('bad');
        } else {
          if (!window.XLSX) throw new Error('xlsx not loaded');
          var wb = XLSX.read(r.result, { type: 'array' });
          var pick = function(names){ for (var i = 0; i < names.length; i++){ if (wb.Sheets[names[i]]) return XLSX.utils.sheet_to_json(wb.Sheets[names[i]], { defval: '' }); } return []; };
          var qRows = pick(['Channels','Quarters','Broadcast, Streaming, App, Website']);
          var showRows = pick(['Audio Downloads','Show Audio Downloads','Shows']);
          var socialRows = pick(['Social Media','Social']);
          data = self.sheetsToData(qRows, showRows, socialRows);
          if (!data.quarters.length) throw new Error('no quarters');
        }
        var merged = self.mergeQuarters(self.state.data, data);
        self.persist(merged);
        var roster = self.state.roster.slice();
        merged.quarters.forEach(function(q){ (q.audioDownloads || []).forEach(function(ep){ var n = (ep.show || '').trim(); if (n && roster.indexOf(n) < 0) roster.push(n); }); });
        self.saveRoster(roster);
        var incoming = data.quarters.map(function(q){ return q.quarter; });
        var target = merged.quarters.findIndex(function(q){ return q.quarter === incoming[incoming.length - 1]; });
        self.setState({ data: merged, roster: roster, qIndex: target >= 0 ? target : merged.quarters.length - 1, dataBadge: 'Saved on this device', view: 'dashboard' });
        self.toastMsg('Imported ' + f.name + ' — updated ' + incoming.join(', '));
      } catch (err){ self.toastMsg("Couldn't read that file — use an .xlsx exported from here (or valid JSON)."); }
    };
    if (isJson) r.readAsText(f); else r.readAsArrayBuffer(f);
    e.target.value = '';
  }

  download(){
    if (!window.XLSX){ this.toastMsg('Spreadsheet engine still loading — try again in a moment.'); return; }
    var sheets = this.dataToSheets();
    var wb = XLSX.utils.book_new();
    var add = function(name, aoa){ var ws = XLSX.utils.aoa_to_sheet(aoa); XLSX.utils.book_append_sheet(wb, ws, name); };
    add('Channels', sheets.channels);
    add('Audio Downloads', sheets.audio);

  prep(el){
    var wrap = el.parentElement; var w = wrap.clientWidth, hh = wrap.clientHeight;
    if (!w || !hh) return null;
    var dpr = window.devicePixelRatio || 1;
    el.width = Math.round(w * dpr); el.height = Math.round(hh * dpr);
    el.style.width = w + 'px'; el.style.height = hh + 'px';
    var ctx = el.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hh);
    return { ctx: ctx, w: w, h: hh };
  }
  dough(id, values, colors){
    var el = document.getElementById(id); if (!el) return; var p = this.prep(el); if (!p) return;
    var ctx = p.ctx, w = p.w, hh = p.h;
    var total = values.reduce(function(a, b){ return a + (Number(b) || 0); }, 0);
    var cx = w / 2, cy = hh / 2, R = Math.min(w, hh) / 2 - 4, r = R * 0.64;
    if (total <= 0){ ctx.fillStyle = '#9a9186'; ctx.font = "12px 'Libre Franklin',sans-serif"; ctx.textAlign = 'center'; ctx.fillText('No data', cx, cy); return; }
    var start = -Math.PI / 2;
    values.forEach(function(v, i){
      var ang = (Number(v) || 0) / total * Math.PI * 2; var end = start + ang;
      ctx.beginPath(); ctx.arc(cx, cy, R, start, end); ctx.arc(cx, cy, r, end, start, true); ctx.closePath();
      ctx.fillStyle = colors[i % colors.length]; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#f3f7fc'; ctx.stroke(); start = end;
    });
  }

  getViewData(){

      quarterOptions: (s.data && s.data.quarters || []).map(function(q, i){ return { value: i, label: q.quarter }; })
    };
    if (!(isDash && hasData)) return base;

    var q = s.data.quarters[s.qIndex];
    var prev = s.data.quarters[s.qIndex - 1] || null;
    var days = this.daysBetween(q.dateRangeStart, q.dateRangeEnd);
    var pDays = prev ? this.daysBetween(prev.dateRangeStart, prev.dateRangeEnd) : 0;

    var bStats = [
      this.stat('Weekly Overall Reach', this.fmtInt(q.broadcast.weeklyOverallReach), q.broadcast.weeklyOverallReach, prev && prev.broadcast.weeklyOverallReach),
      this.stat('Engaged Audience', this.fmtInt(q.broadcast.engagedAudience), q.broadcast.engagedAudience, prev && prev.broadcast.engagedAudience),
      this.stat('Time Engaged (hr:min)', this.minutesToHM(q.broadcast.timeEngagedMinutes), q.broadcast.timeEngagedMinutes, prev && prev.broadcast.timeEngagedMinutes)
    ];
    var cume = this.calcWeeklyAvg(q.streaming.totalCume, days);
    var pCume = prev ? this.calcWeeklyAvg(prev.streaming.totalCume, pDays) : undefined;
    var sStats = [
      this.stat('Weekly Avg. Cume', this.fmtInt(cume), cume, pCume, true),

    ];
    var aUsers = this.calcWeeklyAvg(q.app.totalUsers, days);
    var pAUsers = prev ? this.calcWeeklyAvg(prev.app.totalUsers, pDays) : undefined;
    var perUser = function(a){ var u = Number((a && a.totalUsers) || 0), s2 = Number((a && a.totalSessions) || 0); if (!s2) return 0; return s2 < u ? s2 : (u ? s2 / u : 0); };
    var spu = perUser(q.app);
    var pSpu = prev ? perUser(prev.app) : undefined;
    var aStats = [
      this.stat('Avg. Weekly Users', this.fmtInt(aUsers), aUsers, pAUsers, true),

    var wUsers = this.calcWeeklyAvg(q.website.totalVisitors, days);

    var wStats = [
      this.stat('Avg. Weekly Users', this.fmtInt(wUsers), wUsers, pWUsers, true),
      this.stat('Avg. Session Duration', this.secToMMSS(q.website.avgSessionsPerUserSeconds), q.website.avgSessionsPerUserSeconds, prev && prev.website.avgSessionsPerUserSeconds)
    ];

    var shareValues = (q.audioDownloads || []).map(function(e){ return dlTotal > 0 ? Math.round((Number(e.totalDownloadsOverQuarter) || 0) / dlTotal * 1000) / 10 : 0; });

    };

    var shows = (q.audioDownloads || []).map(function(ep){
      var p = prevShows[ep.show];

        downloads: this.fmtInt(ep.totalDownloadsOverQuarter), dlDelta: dl.delta, dlColor: dl.color,
        avgDaily: this.fmtInt(ep.avgDailyListeners), adDelta: ad.delta, adColor: ad.color,
        topPlayer: ep.topPlayer || '—',

    var mkPosts = function(arr){
      return (arr || []).map(function(p, i){
        return {
          rank: i + 1, title: p.title || 'Untitled post', url: p.url || '', hasUrl: !!(p.url && p.url.trim()),

    }.bind(this);
    var fbPosts = mkPosts(q.social && q.social.facebook);

            h('button', { onClick: function(){ this.removePost(platform, i); }.bind(this), title: 'Remove post', style: pStyle("font:600 11px/1 'Libre Franklin',sans-serif;color:#1c7fb4;background:#fff;border:1px solid rgba(27,23,20,.16);padding:9px 10px;border-radius:8px") }, 'Remove')
          );
        }.bind(this))
      )
    );
  }

  render(){
    var v = this.getViewData();
    var s = this.state;
    return h('div', { style: pStyle('min-height:100vh') },
      this.renderDashboard(v),
      h('input', { type: 'file', accept: '.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/json,.json', ref: this.fileRef, onChange: this.onFile, style: { display: 'none' } }),
      s.toast && h('div', { style: pStyle("position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;background:#1b1714;color:#fff;font:500 13px/1.3 'Libre Franklin',sans-serif;padding:12px 20px;border-radius:11px;box-shadow:0 12px 34px -12px rgba(0,0,0,.5);animation:tfade .25s ease both") }, s.toast)
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
