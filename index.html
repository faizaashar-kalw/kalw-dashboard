<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALW Audience Metrics</title>
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef3fb;font-family:'Libre Franklin',system-ui,sans-serif;color:#1b1714;-webkit-font-smoothing:antialiased}
  a{color:#2aa3e0;text-decoration:none}
  a:hover{color:#1c7fb4;text-decoration:underline}
  ::selection{background:rgba(42,163,224,.18)}
  @keyframes obUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:linear-gradient(150deg,#eaf4fd 0%,#eef3fb 40%,#f6eefb 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(70px)}
  .blob1{width:520px;height:520px;left:-140px;top:-160px;opacity:.5;background:#7fc7ff}
  .blob2{width:460px;height:460px;right:-120px;top:60px;opacity:.42;background:#b79bff}
  .blob3{width:420px;height:420px;left:20%;bottom:-180px;opacity:.4;background:#7be0b0;filter:blur(72px)}
  .blob4{width:360px;height:360px;right:18%;bottom:-140px;opacity:.34;background:#ff8fc7;filter:blur(72px)}

  .topbar{background:#fff;border-bottom:1px solid rgba(27,23,20,.08);height:56px;flex:0 0 auto;display:flex;align-items:center}
  .topbar-inner{max-width:1180px;width:100%;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .eyebrow{font:600 12px/1 'Libre Franklin',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#8a8175}
  .skip{font:500 12.5px/1 'Libre Franklin',sans-serif;color:#8a8175}

  .page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
  .main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:40px 28px 64px}
  .wrap{width:100%;max-width:1000px}
  .hero{display:flex;flex-direction:column;align-items:center;gap:44px;animation:obUp .6s ease both}
  .brand{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:26px}
  .brand img{width:460px;max-width:100%;height:140px;object-fit:contain;display:block;pointer-events:none;user-select:none}
  .titlecard{background:#fff;border-radius:14px 14px 14px 0;padding:19px 40px;box-shadow:0 10px 30px -18px rgba(27,23,20,.4)}
  .titlecard div{font:700 30px/1.2 'Libre Franklin',sans-serif;letter-spacing:-.005em;text-align:center}

  .grid{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center}
  .grid img{width:100%;max-width:508px;object-fit:contain;display:block;pointer-events:none;user-select:none}
  .choices{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
  .choices-title{background:#a8f03c;border-radius:12px 12px 12px 0;padding:19px 26px;box-shadow:0 12px 28px -18px rgba(27,23,20,.5)}
  .choices-title div{font:600 26px/1.15 'Libre Franklin',sans-serif;letter-spacing:-.015em}

  .choice{width:100%;text-align:left;border:0;cursor:pointer;border-radius:12px 12px 12px 0;padding:17px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:22px;box-shadow:0 12px 28px -18px rgba(27,23,20,.5);
    transition:transform .16s ease,box-shadow .16s ease;text-decoration:none;color:inherit}
  .choice:hover{transform:translateY(-2px);box-shadow:0 18px 34px -18px rgba(27,23,20,.55);text-decoration:none}
  .choice.new{background:#2acff5}
  .choice.returning{background:#ff57d0}
  .choice-title{display:block;font:500 25px/1.15 'Libre Franklin',sans-serif;letter-spacing:-.015em;color:#1b1714}
  .choice-sub{display:block;font:400 12.5px/1.35 'Libre Franklin',sans-serif;color:rgba(27,23,20,.72);margin-top:4px}
  .choice-arrow{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font:500 15px/1 'Libre Franklin',sans-serif;color:#1b1714}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr;gap:28px}
    .choices{align-items:stretch}
    .titlecard div{font-size:22px}
    .brand img{height:auto}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>

<div class="page">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="eyebrow">Welcome</div>
      <a class="skip" href="dashboard.html">Skip to dashboard</a>
    </div>
  </div>

  <div class="main">
    <div class="wrap">
      <div class="hero">
        <div class="brand">
          <img src="./assets/kalw-public-media_black-ms6gs0gy-rvun.png" alt="KALW Public Media">
          <div class="titlecard"><div>Audience Metrics Dashboard</div></div>
        </div>
        <div class="grid">
          <img src="./assets/kalw-radio.png" alt="Radio illustration">
          <div class="choices">
            <div class="choices-title"><div>What best describes you?</div></div>
            <a class="choice new" href="tutorial.html">
              <span>
                <span class="choice-title">I'm a new user.</span>
                <span class="choice-sub">Or, I just need a refresher of the content. Take me to the orientation.</span>
              </span>
              <span class="choice-arrow">&rarr;</span>
            </a>
            <a class="choice returning" href="dashboard.html">
              <span>
                <span class="choice-title">I'm a returning user.</span>
                <span class="choice-sub">I feel comfortable with the dashboard. Take me there.</span>
              </span>
              <span class="choice-arrow">&rarr;</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
